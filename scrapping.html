<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <title>Aktualizacja kursów</title>
  <style>
    body {
      font-family: monospace;
      background: #f4f4f4;
      padding: 20px;
    }
    textarea, pre {
      width: 100%;
      box-sizing: border-box;
      font-family: monospace;
      margin-top: 10px;
    }
    textarea {
      height: 150px;
    }
    button {
      padding: 10px 20px;
      font-size: 16px;
      margin-top: 10px;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
    pre {
      background: #fff;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 0 5px #ccc;
    }
    .up { color: green; }
    .down { color: red; }
  </style>
</head>
<body>
    <h1>Crypto-currencies updater</h1>
    <button class="btn btn-secondary mt-3" onclick="location.href='index.html'">Adding game into JSON tool</button>
    <hr>
    <h2>Wklej tutaj cały plik currencies.json:</h2>
    <textarea id="previousInput" placeholder="Wklej cały plik currencies.json (z kluczem &quot;currencies&quot;)..."></textarea>
    <br>
    <button id="updateBtn">UPDATE</button>
    <pre id="output">Wklej plik i kliknij UPDATE.</pre>

  <script>
    const template = {
      "BTC": { precision: 8, againstEurRate: 0 },
      "mBTC": { precision: 5, againstEurRate: 0 },
      "uBTC": { precision: 2, againstEurRate: 0 },
      "ETH": { precision: 8, againstEurRate: 0 },
      "mETH": { precision: 5, againstEurRate: 0 },
      "uETH": { precision: 2, againstEurRate: 0 },
      "LTC": { precision: 8, againstEurRate: 0 },
      "mLTC": { precision: 5, againstEurRate: 0 },
      "uLTC": { precision: 2, againstEurRate: 0 },
      "TRX": { precision: 2, againstEurRate: 0 },
      "DOG": { precision: 2, againstEurRate: 0 },
      "XRP": { precision: 2, againstEurRate: 0 },
      "BCH": { precision: 8, againstEurRate: 0 },
      "mBCH": { precision: 8, againstEurRate: 0 },
      "BNB": { precision: 6, againstEurRate: 0 },
      "ADA": { precision: 2, againstEurRate: 0 },
      "USDC": { precision: 2, againstEurRate: 0 },
      "USDT": { precision: 2, againstEurRate: 0 },
      "BUSD": { precision: 2, againstEurRate: 0 },
      "EOS": { precision: 2, againstEurRate: 0 },
      "DASH": { precision: 4, againstEurRate: 0 },
      "XLM": { precision: 2, againstEurRate: 0 },
      "TON": { precision: 2, againstEurRate: 0 },
      "FTN": { precision: 2, againstEurRate: 0 },
      "DOT": { precision: 4, againstEurRate: 0 },
      "SOL": { precision: 4, againstEurRate: 0 },
      "PPC": { precision: 4, againstEurRate: 0 },
      "VNDC": { precision: 2, againstEurRate: 0 },
      "VSYS": { precision: 2, againstEurRate: 0 },
      "DAI": { precision: 2, againstEurRate: 0 }
    };

    const idToSymbol = {
      bitcoin: "BTC",
      ethereum: "ETH",
      litecoin: "LTC",
      tron: "TRX",
      dogecoin: "DOG",
      ripple: "XRP",
      "bitcoin-cash": "BCH",
      binancecoin: "BNB",
      cardano: "ADA",
      "usd-coin": "USDC",
      tether: "USDT",
      "binance-usd": "BUSD",
      eos: "EOS",
      dash: "DASH",
      stellar: "XLM",
      "the-open-network": "TON",
      fasttoken: "FTN",
      polkadot: "DOT",
      solana: "SOL",
      peercoin: "PPC",
      vndc: "VNDC",
      "v-systems": "VSYS",
      dai: "DAI"
    };

    const url = "https://api.coingecko.com/api/v3/simple/price?ids=bitcoin,ethereum,litecoin,tron,dogecoin,ripple,bitcoin-cash,binancecoin,cardano,usd-coin,tether,binance-usd,eos,dash,stellar,the-open-network,fasttoken,polkadot,solana,peercoin,vndc,v-systems,dai&vs_currencies=eur";

    function findEntry(text, symbol) {
      const regex = new RegExp(`"${symbol}"\\s*:\\s*\\{([^{}]*)\\}`);
      return regex.exec(text);
    }

    function applyRateInText(text, symbol, rawRate) {
      if (!template[symbol]) return text;

      const entryMatch = findEntry(text, symbol);

      if (!entryMatch) {
        const anchor = /"currencies"\s*:\s*\{/.exec(text);
        if (!anchor) return text;
        const precision = template[symbol].precision;
        const newRate = rawRate.toFixed(precision);
        const insertion = `\n    "${symbol}": {\n      "precision": ${precision},\n      "againstEurRate": ${newRate}\n    },`;
        const insertPos = anchor.index + anchor[0].length;
        return text.slice(0, insertPos) + insertion + text.slice(insertPos);
      }

      const body = entryMatch[1];
      const precisionMatch = /"precision"\s*:\s*(-?\d+)/.exec(body);
      const rateMatch = /"againstEurRate"\s*:\s*([-+]?[0-9]*\.?[0-9]+(?:[eE][-+]?[0-9]+)?)/.exec(body);
      if (!rateMatch) return text;

      const precision = precisionMatch ? parseInt(precisionMatch[1], 10) : template[symbol].precision;
      const previousRate = parseFloat(rateMatch[1]);
      const newRate = rawRate.toFixed(precision);

      if (previousRate) {
        const change = 100 * (parseFloat(newRate) - previousRate) / previousRate;
        if (change > 10) {
          alert(`🔼 ${symbol} increased by ${change.toFixed(2)}%\nOld value: ${previousRate}\nNew value: ${newRate}`);
        }
        if (change < -10) {
          alert(`🔽 ${symbol} decreased by ${change.toFixed(2)}%\nOld value: ${previousRate}\nNew value: ${newRate}`);
        }
      }

      const newBody = body.slice(0, rateMatch.index)
        + rateMatch[0].replace(rateMatch[1], newRate)
        + body.slice(rateMatch.index + rateMatch[0].length);
      const newEntry = entryMatch[0].replace(body, newBody);

      return text.slice(0, entryMatch.index) + newEntry + text.slice(entryMatch.index + entryMatch[0].length);
    }

    async function updateRates() {
      const output = document.getElementById("output");
      const rawInput = document.getElementById("previousInput").value.trim();

      if (!rawInput) {
        output.textContent = "Wklej plik i kliknij UPDATE.";
        return;
      }

      try {
        const parsed = JSON.parse(rawInput);
        if (!parsed.currencies) {
          output.textContent = "❌ Wklejony JSON nie zawiera klucza \"currencies\" - wklej cały plik currencies.json.";
          return;
        }
      } catch (e) {
        output.textContent = "❌ Wklejony tekst nie jest poprawnym JSON-em: " + e.message;
        return;
      }

      try {
        const res = await fetch(url);
        const data = await res.json();

        let text = rawInput;
        for (const [id, { eur }] of Object.entries(data)) {
          const base = idToSymbol[id];
          if (!base || !eur || eur === 0) continue;

          const inverse = 1 / eur;
          text = applyRateInText(text, base, inverse);
          text = applyRateInText(text, "m" + base, inverse * 1000);
          text = applyRateInText(text, "u" + base, inverse * 1000000);
        }

        output.textContent = text;
      } catch (e) {
        output.textContent = "❌ Error during data download: " + e.message;
      }
    }

    document.getElementById("updateBtn").addEventListener("click", updateRates);
    updateRates(); // shows the "paste the file" hint on load
  </script>

</body>
</html>
